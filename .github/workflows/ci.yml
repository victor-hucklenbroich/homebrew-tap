# Lints the tap on every push/PR including the automated version bumps pushed
# by the desk-controller and speedtest-cli release workflows so a malformed
# cask/formula doesn't get deployed.
#
# GoReleaser (speedtest-cli's release) regenerates speedtest.rb with cosmetic
# stanza ordering that newer Homebrew rubocop rejects. The style
# step autocorrects and commits the correction back.
# Non-autocorrectable offenses fail the job.
#
# Autocorrect is limited to Casks/ (and only Casks/ is ever committed).
name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_INSTALL_CLEANUP: "1"
  HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  audit:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      # brew's style/audit commands only operate on installed taps, so expose
      # this checkout as the tap instead of cloning it a second time.
      - name: Register checkout as victor-hucklenbroich/tap
        run: |
          tap_dir="$(brew --repository)/Library/Taps/victor-hucklenbroich/homebrew-tap"
          mkdir -p "$(dirname "$tap_dir")"
          ln -s "$GITHUB_WORKSPACE" "$tap_dir"

      - name: brew style (autocorrect)
        run: |
          if brew style --fix Casks/*.rb; then
            if [ -n "$(git status --porcelain -- Casks)" ]; then
              echo "brew style autocorrected:"
              git --no-pager diff -- Casks
              if [ "${{ github.event_name }}" = "push" ]; then
                git config user.name "github-actions[bot]"
                git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                git commit -m "style: brew style --fix" -- Casks
                git push origin "HEAD:${{ github.ref_name }}"
              else
                echo "::error::Cask style is not compliant. Run 'brew style --fix' locally and commit."
                exit 1
              fi
            fi
          else
            echo "::error::brew style found offenses it cannot autocorrect."
            exit 1
          fi

      - name: Audit casks
        run: basename -s .rb Casks/*.rb | sed 's|^|victor-hucklenbroich/tap/|' | xargs brew audit --cask --online
